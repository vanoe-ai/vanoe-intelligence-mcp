name: Publish to the MCP registry

# Publishes server.json to registry.modelcontextprotocol.io using GitHub OIDC
# (no stored secrets). Run it after the matching version is on PyPI: the
# registry verifies PyPI ownership through the `mcp-name` marker in the
# package README. Runs on both a manual dispatch and a published release;
# a version the registry already lists is skipped, so the second trigger
# never fails with "cannot publish duplicate version".
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
      - name: Check that server.json and pyproject agree on the version
        run: |
          v_json=$(python3 -c "import json;print(json.load(open('server.json'))['version'])")
          v_py=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$v_json" = "$v_py" || { echo "server.json $v_json != pyproject $v_py"; exit 1; }
      - name: Skip if the registry already lists this version
        id: check
        run: |
          name=$(python3 -c "import json;print(json.load(open('server.json'))['name'])")
          version=$(python3 -c "import json;print(json.load(open('server.json'))['version'])")
          url="https://registry.modelcontextprotocol.io/v0/servers/$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$name")/versions/$version"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
          if [ "$code" = "200" ]; then
            echo "$name $version is already in the registry; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$name $version not listed yet (HTTP $code); publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Login (GitHub OIDC)
        if: steps.check.outputs.publish == 'true'
        run: mcp-publisher login github-oidc
      - name: Publish
        if: steps.check.outputs.publish == 'true'
        run: mcp-publisher publish
